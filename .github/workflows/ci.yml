name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Prettier's Tailwind plugin reads the generated theme, so build tokens first.
      - run: pnpm --filter @ledgerly/tokens build
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # End-to-end and axe checks run against the production build from the step above.
      - run: pnpm --filter @ledgerly/web exec playwright install --with-deps chromium
      - run: pnpm --filter @ledgerly/web e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7
